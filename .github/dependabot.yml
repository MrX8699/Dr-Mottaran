# Opens pull requests for dependency updates (see "Dependencies" in
# README.md). The CI check (ci.yml) builds each one; merging it changes
# main only, and the live site changes only with a release tag. npm major
# versions are left out on purpose: they need a planned upgrade (Next 16
# drops `next lint`, for example).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
